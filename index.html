<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión Hotelera</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema Central de Reservas</h1>
    </header>
    <main class="contenedor-centrado">
        <section class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            <form action="dashboard.html" method="GET">
                <div class="grupo-control">
                    <label for="codigo_sede">Código de la Sede</label>
                    <input type="text" id="codigo_sede" name="codigo_sede" required>
                </div>
                
                <div class="grupo-control">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                
                <div class="grupo-control">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="acciones-formulario">
                    <a href="index.html" class="enlace-secundario" onclick="alert('Se ha enviado un enlace de recuperación a su correo corporativo.'); return false;">¿Olvidaste tu contraseña?</a>
                    <button type="submit" class="btn-principal">Ingresar</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>Grupo 2 - Ingeniería Web 2026</p>
    </footer>
</body>
</html>
